# Don't contact another Config Server
spring.config.import=

# Disable health check for Config Server repository
management.health.config.enabled=false

# Fake Git repository (never cloned)
spring.cloud.config.server.git.uri=file:./dummy-config

spring.cloud.config.server.git.clone-on-start=false
spring.cloud.config.server.git.force-pull=false
spring.cloud.config.server.git.default-label=main