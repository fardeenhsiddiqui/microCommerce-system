name: Build MicroCommerce

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: api-gateway
            image: api-gateway
          - service: config-server
            image: config-server
          - service: discovery-server
            image: discovery-server
          - service: notificationService
            image: notification-service
          - service: product-service
            image: product-service
          - service: userService
            image: user-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Build Docker Image
        working-directory: ${{ matrix.service }}
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest \
            .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest


  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github-actions-microcommerce
          chmod 600 ~/.ssh/github-actions-microcommerce

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh \
            -i ~/.ssh/github-actions-microcommerce \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            'bash -s' << 'EOF'

            set -e

            cd ~/microCommerce-system

            echo "======================================"
            echo "Pulling latest Docker images..."
            echo "======================================"

            docker compose pull

            echo "======================================"
            echo "Starting updated services..."
            echo "======================================"

            docker compose up -d --remove-orphans

            echo "======================================"
            echo "Waiting for services to become healthy..."
            echo "======================================"

            services=(
              api-gateway
              config-server
              discovery-server
              notification-service
              product-service
              user-service
              postgres
              rabbitmq
              redis
              elasticsearch-com
            )

            timeout=600
            elapsed=0

            while [ $elapsed -lt $timeout ]; do

              all_healthy=true

              for service in "${services[@]}"; do

                status=$(docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$service" 2>/dev/null || echo "missing")

                echo "$service: $status"

                if [ "$status" != "healthy" ]; then
                  all_healthy=false
                fi

              done

              if [ "$all_healthy" = true ]; then

                echo "======================================"
                echo "All services are healthy."
                echo "Deployment successful."
                echo "======================================"

                break

              fi

              echo "Waiting 10 seconds..."

              sleep 10
              elapsed=$((elapsed + 10))

            done

            if [ "$all_healthy" != true ]; then

              echo "======================================"
              echo "Deployment failed."
              echo "Services did not become healthy within 10 minutes."
              echo "======================================"

              docker compose ps

              exit 1

            fi

            echo "======================================"
            echo "EC2 deployment completed successfully."
            echo "======================================"

          EOF